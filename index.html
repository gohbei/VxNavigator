<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Vaccine Guide SG</title>
    <meta name="description" content="Evidence-grounded adult vaccination education and patient awareness guide for Singapore, aligning with NAIS guidelines and verified public health sources." />
    <meta property="og:title" content="My Vaccine Guide SG" />
    <meta property="og:description" content="Evidence-grounded adult vaccination education and patient awareness guide for Singapore, aligning with NAIS guidelines and verified public health sources." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // HMR is disabled in AI Studio preview iframe. Suppress Vite HMR WebSocket connection errors.
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          (event.reason.message && event.reason.message.includes('WebSocket')) ||
          (event.reason.stack && (event.reason.stack.includes('@vite/client') || event.reason.stack.includes('vite')))
        )) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          (event.message && event.message.includes('WebSocket')) ||
          (event.filename && event.filename.includes('@vite/client'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
